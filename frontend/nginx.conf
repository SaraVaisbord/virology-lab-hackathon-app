server {
    listen 80;
    root /usr/share/nginx/html;

    # Built assets have content hashes in their names — cache them; index.html never.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
